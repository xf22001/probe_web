name: Build Go iOS .xcframework

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS .xcframework
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install gomobile tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Download Dependencies
        run: |
          go mod tidy
          go get golang.org/x/mobile/bind

      - name: Initialize gomobile
        run: gomobile init

      - name: Build iOS .xcframework
        run: |
          gomobile bind -target=ios -o ProbeTool.xcframework probetool/server

      - name: Upload iOS xcframework artifact
        uses: actions/upload-artifact@v4
        with:
          name: probetool-xcframework
          path: ProbeTool.xcframework
          retention-days: 7
